name: Verify template

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the committed dependency graph
        run: npm ci
      - name: Compile and test contracts (no fork, wallet or feed)
        run: npm run hardhat:test
      - name: Test receipt verification and tamper cases
        run: npm run test:hcs-ui
      - name: Lint both workspaces
        run: npm run lint -- --max-warnings=0
      - name: Check both workspaces
        run: |
          npm run hardhat:check-types
          npm run next:check-types
      - name: Build production application
        run: npm run next:build
      - name: Boot production routes
        run: npm run test:ui-boot
